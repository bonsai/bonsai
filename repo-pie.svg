<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">bonsai repository composition</title>
  <desc id="desc">Approximately 1,300 repositories: 849 original and 451 forks.</desc>
  <rect width="720" height="360" rx="24" fill="#0d1117"/>
  <text x="360" y="42" text-anchor="middle" fill="#f0f6fc" font-family="system-ui,sans-serif" font-size="24" font-weight="700">🌱 Repository Composition</text>
  <g transform="translate(180 190)">
    <circle r="110" fill="none" stroke="#30363d" stroke-width="58"/>
    <circle r="110" fill="none" stroke="#3fb950" stroke-width="58" stroke-dasharray="451 691" stroke-dashoffset="0" transform="rotate(-90)"/>
    <circle r="110" fill="none" stroke="#58a6ff" stroke-width="58" stroke-dasharray="451 691" stroke-dashoffset="-451" transform="rotate(-90)"/>
    <circle r="72" fill="#0d1117"/>
    <text y="-4" text-anchor="middle" fill="#f0f6fc" font-family="system-ui,sans-serif" font-size="26" font-weight="700">~1,300</text>
    <text y="22" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="14">repos</text>
  </g>
  <g transform="translate(370 118)" font-family="system-ui,sans-serif">
    <rect width="18" height="18" rx="4" fill="#3fb950"/>
    <text x="30" y="15" fill="#f0f6fc" font-size="18" font-weight="700">Original</text>
    <text x="30" y="39" fill="#8b949e" font-size="15">~849 · 65%</text>
    <rect y="78" width="18" height="18" rx="4" fill="#58a6ff"/>
    <text x="30" y="93" fill="#f0f6fc" font-size="18" font-weight="700">Fork</text>
    <text x="30" y="117" fill="#8b949e" font-size="15">451 · 35%</text>
  </g>
  <text x="360" y="326" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="12">Estimated from total ~1,300 · public 734 · private original ~566</text>
</svg>

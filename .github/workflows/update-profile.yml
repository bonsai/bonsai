name: Update profile

on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 00:00 UTC (JST 09:00)
  workflow_dispatch:       # 手動実行も可能

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch repository stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "users/bonsai/repos?per_page=100" --paginate \
            --jq '.[] | {name, description, language, stargazers_count, forks_count, created_at, updated_at, pushed_at, fork, archived, topics, homepage}' \
            > data/bonsai_repos.jsonl
          wc -l data/bonsai_repos.jsonl

      - name: Fetch 90-day contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FROM=$(date -u -d '90 days ago' +%Y-%m-%dT00:00:00Z)
          TO=$(date -u +%Y-%m-%dT00:00:00Z)
          gh api graphql -f query='
          query($from: DateTime!, $to: DateTime!) {
            user(login: "bonsai") {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                  weeks { contributionDays { date contributionCount } }
                }
              }
            }
          }' -f from="$FROM" -f to="$TO" \
            --jq '.data.user.contributionsCollection.contributionCalendar' \
            > data/kusa_3mo.json
          cat data/kusa_3mo.json | head -c 120; echo

      - name: Generate site assets
        run: |
          cp data/bonsai_repos.jsonl scripts/bonsai_repos.jsonl
          cp data/kusa_3mo.json scripts/kusa_3mo.json
          (cd scripts && python3 generate_kusa.py && python3 generate_portfolio.py)
          mv scripts/kusa.svg docs/kusa.svg
          mv scripts/portfolio.html docs/portfolio.html
          mv scripts/index.html docs/index.html
          rm -f scripts/README.md scripts/bonsai_repos.jsonl scripts/kusa_3mo.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/ docs/ scripts/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update profile stats (auto)"
            git push
          fi
